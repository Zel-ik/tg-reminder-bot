version: '3.8'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: reminders
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./migrations:/migrations
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d reminders"]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 5s

  bot:
    build: .
    restart: on-failure
    environment:
      TELEGRAM_TOKEN: "7676580212:AAEVjbSCbUu9BrcpVH35rZq3ygE7vVdknWc"
      DATABASE_URL: "postgres://user:password@db:5432/reminders?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
