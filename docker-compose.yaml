version: '3.8'

services:
  app:
    build: .
    container_name: tg_reminder
    restart: always
    depends_on:
      - db
    env_file:
      - .env  
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    ports:
      - "8080:8080"

  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    env_file:
      - .env  # Загружаем переменные из .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
